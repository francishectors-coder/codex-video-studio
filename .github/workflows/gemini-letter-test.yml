name: Ang Huling Kahon Gemini continuity test

on:
  workflow_dispatch:
    inputs:
      generate:
        description: Submit three billable Gemini video requests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ang-huling-kahon-gemini-test
  cancel-in-progress: false

jobs:
  letter-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: films/ang-huling-kahon/gemini-test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check references and shot list
        run: python generate.py
      - name: Verify secret is available
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::The GEMINI_API_KEY Actions secret is unavailable."
            exit 1
          fi
          echo "The Gemini API secret is available."
      - name: Install Gemini SDK
        if: inputs.generate
        run: python -m pip install google-genai==3.6.1
      - name: Generate three 8-second 720p clips
        if: inputs.generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate.py --generate
      - name: Upload generated clips
        if: always() && inputs.generate
        uses: actions/upload-artifact@v4
        with:
          name: ang-huling-kahon-gemini-letter-test
          path: films/ang-huling-kahon/gemini-test/0*.mp4
          if-no-files-found: ignore
          retention-days: 7
